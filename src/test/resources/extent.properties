#Extent Report Configuration
extent.reporter.spark.start=true
extent.reporter.spark.out=reports/extent-report/SparkReport.html

extent.reporter.spark.config=src/test/resources/extent-config.xml

#Screenshot settings
screenshot.dir=reports/screenshots/
screenshot.rel.path=../screenshots/

#Category settings — use FEATURE names, NOT tags
tag.as.category=false

#System Info
systeminfo.Application=Automation Exercise
systeminfo.Framework=Cucumber BDD + TestNG
systeminfo.Environment=QA
systeminfo.Browser=Chrome
