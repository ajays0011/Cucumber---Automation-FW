name: 🚀 Automation Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'qa'
        type: choice
        options: [dev, qa, prod]
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options: [chrome, firefox, edge]
      tags:
        description: 'Cucumber tags to run'
        required: false
        default: '@smoke or @regression'
      headless:
        description: 'Run in headless mode'
        required: true
        default: 'true'
        type: boolean

env:
  JAVA_VERSION: '17'
  ENV: ${{ github.event.inputs.environment || 'qa' }}
  BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
  HEADLESS: ${{ github.event.inputs.headless || 'true' }}

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run Tests
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Run Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🌐 Setup Chrome
        if: env.BROWSER == 'chrome'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: 🌐 Setup Firefox
        if: env.BROWSER == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: 📦 Download Previous Allure History
        id: allure-history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-results/history
        continue-on-error: true

      - name: 📦 Download Execution History
        uses: actions/download-artifact@v4
        with:
          name: execution-history
          path: reports/
        continue-on-error: true

      - name: 🧪 Run Tests
        run: |
          mvn clean test \
            -Denv=${{ env.ENV }} \
            -Dbrowser=${{ env.BROWSER }} \
            -Dheadless=${{ env.HEADLESS }} \
            -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@smoke or @regression' }}" \
            -Ddataproviderthreadcount=4 \
            -DfailIfNoTests=false
        continue-on-error: true

      - name: 📊 Install Allure CLI
        run: |
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxf allure.tgz
          echo "$PWD/allure-2.29.0/bin" >> $GITHUB_PATH

      - name: 📊 Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: 💾 Save Allure History
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-report/history
          retention-days: 90

      - name: 💾 Save Execution History
        uses: actions/upload-artifact@v4
        with:
          name: execution-history
          path: reports/execution-history.json
          retention-days: 90
        continue-on-error: true

      - name: 📤 Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: 📤 Upload Extent Report
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports/extent-report/
          retention-days: 30
        continue-on-error: true

      - name: 📤 Upload Cucumber Report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 30
        continue-on-error: true

      - name: 📤 Upload Test Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: logs/
          retention-days: 14
        continue-on-error: true

      - name: 📤 Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots
          path: reports/screenshots/
          retention-days: 14
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 2: Deploy Reports to GitHub Pages
  # ─────────────────────────────────────────────
  deploy-report:
    name: 🌐 Deploy Reports to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      pages: write

    steps:
      - name: 📥 Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          keep_files: false

  # ─────────────────────────────────────────────
  # Job 3: Notify on Failure
  # ─────────────────────────────────────────────
  notify:
    name: 🔔 Send Notifications
    needs: test
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: 📧 Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.test.result }}
          text: |
            ❌ Test Pipeline Failed!
            Environment: ${{ env.ENV }}
            Browser: ${{ env.BROWSER }}
            Branch: ${{ github.ref_name }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
